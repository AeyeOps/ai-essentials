# AEO Ghostty session launcher — shared settings.
# AEO_GHOSTTY_LAUNCHER_CONF_VERSION=2
#
# Included from the main Ghostty config via `config-file = aeo-launcher.conf`.
# Ghostty resolves the relative path against ~/.config/ghostty/, and an included
# file's keys override the parent's on conflict — so these settings win even if
# the parent config set them. The installer discloses the keys below before it
# adds the include line.

# Native splits stay native: each new surface runs the rc-guard launcher and
# lands in its own tmux session, so splits are recoverable per-surface.
keybind = alt+d=new_split:right
keybind = alt+shift+d=new_split:down

# Decoration/CSD mouse-offset fix (gated — uncommented by the installer only
# when the current desktop needs it). Plasma/KWin should use server-side
# decorations so KWin provides resize handles without Ghostty's GTK CSD frame
# extents; the GTK titlebar is disabled so Plasma owns the titlebar. Older or
# non-SSD tiling WMs can still use the borderless fallback below, which zeroes
# the extents but removes all window decorations.
# Diagnose by hand with `xprop _GTK_FRAME_EXTENTS` on the Ghostty window
# (nonzero left/top = horizontal/vertical offset in pixels).
# Plasma/KWin:
# window-decoration = server
# gtk-titlebar = false
# Borderless fallback for tiling WMs without usable server-side decorations:
# window-decoration = none
