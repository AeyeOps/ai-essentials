# Prefix: Ctrl+Space (avoids conflict with Claude Code's Ctrl+b)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal & true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ga update-environment COLORTERM
set-environment -g COLORTERM truecolor

# Responsiveness (critical for Claude Code / Vim)
set -sg escape-time 0

# Mouse & scrollback
set -g mouse on
set -g history-limit 50000

# Vi copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Clipboard via OSC 52 (works in Windows Terminal natively)
set -s set-clipboard on
set -g allow-passthrough on

# Focus events (needed for Vim autoread, terminal apps)
set -g focus-events on

# Window numbering from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off

# Pane splits in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Quick reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Set pane title (Ctrl+Space T)
bind T command-prompt -p "Pane title:" "select-pane -T '%%'"

# Unbind replaced bindings (source-file doesn't clear stale binds)
unbind J
unbind i

# Navigator: view, jump, and move panes/windows across sessions (Ctrl+Space Tab)
bind Tab display-popup -E -T "Navigator" -w 90% -h 70% '~/.config/tmux/scripts/navigator.sh'

# Merge all detached sessions into current (Ctrl+Space M)
bind M run-shell 'for s in $(tmux list-sessions -F "##S" -f "##{?session_attached,,1}"); do while tmux list-windows -t "$s" 2>/dev/null | grep -q .; do tmux move-window -s "$s"; done; done'

# ─────────────────────────────────────────────────────────────
# 3-line status bar with keyboard reference
# ─────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status 3

# Colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left ""
set -g status-right ""

# Pane border titles
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#89b4fa bold],#[fg=#585b70]}#{window_index}.#{pane_index} #{window_name} │ #{pane_title} │ #{pane_current_command} "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Aligned 3-row keyboard reference (8 columns + overflow)
# Col widths: 12  14  11  14  10  10  10  10

# Row 1: Windows
set -g status-format[0] "#[bg=#313244,fg=#89b4fa,bold] WINDOWS #[bg=#1e1e2e]  #[fg=#89b4fa,bold]c #[fg=#6c7086,nobold]new       #[fg=#89b4fa,bold]n/p #[fg=#6c7086]nxt/prv   #[fg=#89b4fa,bold]0-9 #[fg=#6c7086]goto   #[fg=#89b4fa,bold], #[fg=#6c7086]rename      #[fg=#89b4fa,bold]T #[fg=#6c7086]title   #[fg=#89b4fa,bold]& #[fg=#6c7086]kill    #[fg=#89b4fa,bold]w #[fg=#6c7086]list    #[fg=#89b4fa,bold]f #[fg=#6c7086]find    #[align=right]#{W:#[fg=#585b70] #{window_index}:#{window_name} ,#[fg=#89b4fa bold] #{window_index}:#{window_name} #[nobold]}"

# Row 2: Panes & Layout
set -g status-format[1] "#[bg=#313244,fg=#a6e3a1,bold]  PANES  #[bg=#1e1e2e]  #[fg=#a6e3a1,bold]|/- #[fg=#6c7086,nobold]split   #[fg=#a6e3a1,bold]←↑↓→ #[fg=#6c7086]nav      #[fg=#a6e3a1,bold]z #[fg=#6c7086]zoom     #[fg=#a6e3a1,bold]x #[fg=#6c7086]kill        #[fg=#a6e3a1,bold]{ #[fg=#6c7086]swap    #[fg=#a6e3a1,bold]o #[fg=#6c7086]cycle   #[fg=#a6e3a1,bold]! #[fg=#6c7086]break   #[fg=#a6e3a1,bold]spc #[fg=#6c7086]lay   #[fg=#a6e3a1,bold]M1-5 #[fg=#6c7086]presets  #[fg=#a6e3a1,bold]C-←↑↓→ #[fg=#6c7086]resize"

# Row 3: Session & Misc
set -g status-format[2] "#[bg=#313244,fg=#f38ba8,bold] SESSION #[bg=#1e1e2e]  #[fg=#f38ba8,bold]d #[fg=#6c7086,nobold]detach    #[fg=#f38ba8,bold]s #[fg=#6c7086]list        #[fg=#f38ba8,bold]$ #[fg=#6c7086]rename   #[fg=#f38ba8,bold](/) #[fg=#6c7086]prv/nxt   #[fg=#f38ba8,bold][ #[fg=#6c7086]copy    #[fg=#f38ba8,bold]] #[fg=#6c7086]paste   #[fg=#f38ba8,bold]? #[fg=#6c7086]keys    #[fg=#f38ba8,bold]t #[fg=#6c7086]clock   #[fg=#f38ba8,bold]r #[fg=#6c7086]reload  #[fg=#f38ba8,bold]M #[fg=#6c7086]merge   #[align=right]#[fg=#f38ba8,bold]⇥ #[fg=#6c7086]nav  #{?client_prefix,#[bg=#a6e3a1 fg=#1e1e2e bold] PREFIX ,#[fg=#585b70] C-Space }#[fg=#585b70] │ #{session_name}:#{window_index}.#{pane_index} │ #{pane_title} "
