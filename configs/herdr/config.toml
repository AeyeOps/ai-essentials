onboarding = false

[keys]
# ctrl+b would collide with tmux's default prefix when herdr runs inside tmux
prefix = "ctrl+a"

[theme]
name = "tokyo-night"

[theme.custom]
panel_bg = "#000000"

[ui.toast]
delivery = "system"

[session]
resume_agents_on_restore = true

[experimental]
# persists pane contents to disk across server restarts/crashes;
# scrollback may retain secrets printed in terminals
pane_history = true
